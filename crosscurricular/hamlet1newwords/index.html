<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hamlet 1 New Words</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f5f7fa;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  .container {
    background: #fff;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    text-align: center;
    width: 380px;
  }
  h1 { font-size: 20px; margin-bottom: 12px; color: #333; }
  #gameTitle { font-size: 24px; color: #333; margin-bottom: 12px; }
  input[type="text"] { padding: 10px; width: 80%; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 20px; }
  button {
    padding: 12px; margin: 8px 0; width: 100%; border: none;
    border-radius: 8px; font-size: 16px; cursor: pointer; transition: background 0.2s;
  }
  .primary { background-color: #4CAF50; color: white; }
  .primary:hover { background-color: #45a049; }
  .play-btn { background-color: #1E90FF; color: white; }
  .play-btn:hover { background-color: #1C86EE; }
  .choice-btn { margin: 5px 0; border: none; border-radius: 8px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
  .choice-btn:hover { opacity: 0.9; }
  .choice-btn.correct { animation: pulse 0.5s ease; }
  @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 0px #4CAF50; } 50% { transform: scale(1.1); box-shadow: 0 0 12px #4CAF50; } 100% { transform: scale(1); box-shadow: 0 0 0px #4CAF50; } }
  .feedback { margin-top: 15px; font-weight: bold; font-size: 18px; }
  .hidden { display: none; }
  .progress-bar { width: 100%; height: 8px; background-color: #e0e0e0; border-radius: 4px; margin-bottom: 12px; }
  #progressFill { height: 100%; width: 0%; background-color: #FFA500; border-radius: 4px; transition: width 0.3s ease, background-color 0.3s ease; }
  #questionCounter { margin-bottom: 8px; font-weight: bold; color: #555; font-size: 16px; }
  @media (max-width: 768px) {
    .container { width: 90%; padding: 20px; }
    #gameTitle { font-size: 28px; }
    h1 { font-size: 22px; }
    button { font-size: 18px; padding: 16px; }
    .choice-btn { font-size: 20px; padding: 18px; }
    .feedback { font-size: 20px; }
  }
</style>
</head>
<body>

<div class="container" id="startScreen">
  <h1>Enter nickname</h1>
  <input type="text" id="nickname" placeholder="Your name">
  <button class="primary" onclick="startQuiz()">Start</button>
</div>

<div class="container hidden" id="quizScreen">
  <h1 id="gameTitle">Hamlet 1 New Words</h1>
  <div class="progress-bar"><div id="progressFill"></div></div>
  <div id="questionCounter">Question 1 of 10</div>
  <h1 id="questionTitle">Listen and choose:</h1>
  <button class="play-btn" onclick="playWord()">🔊 Play Word</button>
  <div id="choices"></div>
  <div class="feedback" id="feedback"></div>
</div>

<div class="container hidden" id="endScreen">
  <h1>Quiz Finished!</h1>
  <p id="finalResult"></p>
  <button class="primary" onclick="location.reload()">Play Again</button>
</div>

<script>
// ====== Replace with your generated array including MP3 paths ======
const allWords = [
  { en: "new king", jp: "新しい王", enAudio: "audio/new_king_en.mp3", jpAudio: "audio/新しい王_jp.mp3" },
  { en: "married", jp: "結婚した", enAudio: "audio/married_en.mp3", jpAudio: "audio/結婚した_jp.mp3" },
  { en: "sad", jp: "悲しい", enAudio: "audio/sad_en.mp3", jpAudio: "audio/悲しい_jp.mp3" },
  { en: "angry", jp: "怒っている", enAudio: "audio/angry_en.mp3", jpAudio: "audio/怒っている_jp.mp3" },
  { en: "uncle", jp: "叔父", enAudio: "audio/uncle_en.mp3", jpAudio: "audio/叔父_jp.mp3" },
  { en: "very quickly", jp: "とても早く", enAudio: "audio/very_quickly_en.mp3", jpAudio: "audio/とても早く_jp.mp3" },
  { en: "ghost", jp: "幽霊", enAudio: "audio/ghost_en.mp3", jpAudio: "audio/幽霊_jp.mp3" },
  { en: "secret", jp: "秘密", enAudio: "audio/secret_en.mp3", jpAudio: "audio/秘密_jp.mp3" },
  { en: "snake bite", jp: "ヘビに噛まれること", enAudio: "audio/snake_bite_en.mp3", jpAudio: "audio/ヘビに噛まれること_jp.mp3" },
  { en: "poison", jp: "毒", enAudio: "audio/poison_en.mp3", jpAudio: "audio/毒_jp.mp3" },
  { en: "revenge", jp: "復讐", enAudio: "audio/revenge_en.mp3", jpAudio: "audio/復讐_jp.mp3" },
  { en: "act crazy", jp: "狂ったふりをする", enAudio: "audio/act_crazy_en.mp3", jpAudio: "audio/狂ったふりをする_jp.mp3" },
  { en: "son", jp: "息子", enAudio: "audio/son_en.mp3", jpAudio: "audio/息子_jp.mp3" },
  { en: "stepfather", jp: "継父", enAudio: "audio/stepfather_en.mp3", jpAudio: "audio/継父_jp.mp3" },
  { en: "kin", jp: "親族", enAudio: "audio/kin_en.mp3", jpAudio: "audio/親族_jp.mp3" },
  { en: "kind", jp: "良い", enAudio: "audio/kind_en.mp3", jpAudio: "audio/良い_jp.mp3" },
  { en: "feelings", jp: "感情", enAudio: "audio/feelings_en.mp3", jpAudio: "audio/感情_jp.mp3" },
  { en: "talking to himself", jp: "独り言を言っている", enAudio: "audio/talking_to_himself_en.mp3", jpAudio: "audio/独り言を言っている_jp.mp3" },
  { en: "remarried", jp: "再婚した", enAudio: "audio/remarried_en.mp3", jpAudio: "audio/再婚した_jp.mp3" },
  { en: "same month", jp: "同じ月", enAudio: "audio/same_month_en.mp3", jpAudio: "audio/同じ月_jp.mp3" },
  { en: "hurt", jp: "心が傷ついた", enAudio: "audio/hurt_en.mp3", jpAudio: "audio/心が傷ついた_jp.mp3" },
  { en: "disgusted", jp: "嫌悪感を感じている", enAudio: "audio/disgusted_en.mp3", jpAudio: "audio/嫌悪感を感じている_jp.mp3" },
  { en: "quick marriage", jp: "早すぎる結婚", enAudio: "audio/quick_marriage_en.mp3", jpAudio: "audio/早すぎる結婚_jp.mp3" },
  { en: "moral weakness", jp: "道徳的な弱さ", enAudio: "audio/moral_weakness_en.mp3", jpAudio: "audio/道徳的な弱さ_jp.mp3" },
  { en: "lack of loyalty", jp: "忠実さの欠如", enAudio: "audio/lack_of_loyalty_en.mp3", jpAudio: "audio/忠実さの欠如_jp.mp3" },
  { en: "disloyal", jp: "不忠実な", enAudio: "audio/disloyal_en.mp3", jpAudio: "audio/不忠実な_jp.mp3" },
  { en: "battle", jp: "戦い", enAudio: "audio/battle_en.mp3", jpAudio: "audio/戦い_jp.mp3" },
  { en: "lands", jp: "領土", enAudio: "audio/lands_en.mp3", jpAudio: "audio/領土_jp.mp3" },
  { en: "funeral", jp: "葬儀", enAudio: "audio/funeral_en.mp3", jpAudio: "audio/葬儀_jp.mp3" },
  { en: "spirit", jp: "精神", enAudio: "audio/spirit_en.mp3", jpAudio: "audio/精神_jp.mp3" },
  { en: "murdered", jp: "殺害された", enAudio: "audio/murdered_en.mp3", jpAudio: "audio/殺害された_jp.mp3" },
  { en: "sword", jp: "剣", enAudio: "audio/sword_en.mp3", jpAudio: "audio/剣_jp.mp3" },
  { en: "widow", jp: "未亡人", enAudio: "audio/widow_en.mp3", jpAudio: "audio/未亡人_jp.mp3" },
  { en: "cousin", jp: "いとこ", enAudio: "audio/cousin_en.mp3", jpAudio: "audio/いとこ_jp.mp3" },
  { en: "frailty", jp: "脆さ", enAudio: "audio/frailty_en.mp3", jpAudio: "audio/脆さ_jp.mp3" },
  { en: "obey", jp: "従う", enAudio: "audio/obey_en.mp3", jpAudio: "audio/従う_jp.mp3" },
  { en: "serpent", jp: "大蛇", enAudio: "audio/serpent_en.mp3", jpAudio: "audio/大蛇_jp.mp3" },
];

// ====== Quiz logic ======
let words = [];
let nickname = localStorage.getItem("nickname") || "";
let currentQuestion = 0;
let score = 0;
let firstTry = true;
let startTime;
const progressKey = "quizProgress";
let progressData = JSON.parse(localStorage.getItem(progressKey)) || {
  seen: {},
  wrong: {}
};	
	
	
	

const startScreen = document.getElementById("startScreen");
const quizScreen = document.getElementById("quizScreen");
const endScreen = document.getElementById("endScreen");
const choicesDiv = document.getElementById("choices");
const feedbackDiv = document.getElementById("feedback");
const finalResult = document.getElementById("finalResult");
const questionCounterDiv = document.getElementById("questionCounter");
const progressFill = document.getElementById("progressFill");

function startQuiz() {
  const inputName = document.getElementById("nickname").value.trim();
  nickname = inputName || localStorage.getItem("nickname") || "Player";

  // save nickname for future quizzes
  localStorage.setItem("nickname", nickname);

  startTime = new Date();
  let weightedWords = [...allWords];

// Sort by priority:
// 1. Most wrong
// 2. Least seen
weightedWords.sort((a, b) => {
  const wrongA = progressData.wrong[a.en] || 0;
  const wrongB = progressData.wrong[b.en] || 0;

  const seenA = progressData.seen[a.en] || 0;
  const seenB = progressData.seen[b.en] || 0;

  // prioritize wrong answers
  if (wrongB !== wrongA) return wrongB - wrongA;

  // then prioritize unseen words
  return seenA - seenB;
});

// Take top 15 candidates, then randomize slightly
// Split into problem words (top) and others
let strongPool = weightedWords.slice(0, 10);   // high priority (wrong answers)
let weakPool = weightedWords.slice(10);        // lower priority (less seen / new)

// Shuffle both groups
shuffle(strongPool);
shuffle(weakPool);

// Mix: mostly problem words + some new words
words = [
  ...strongPool.slice(0, 6),
  ...weakPool.slice(0, 4)
];

// Final shuffle so order feels random
shuffle(words);

  startScreen.classList.add("hidden");
  quizScreen.classList.remove("hidden");
  currentQuestion = 0;
  score = 0;
  showQuestion();
}

function showQuestion() {
  feedbackDiv.textContent = "";
feedbackDiv.className = "feedback";
feedbackDiv.style.color = "";
  firstTry = true;
  choicesDiv.innerHTML = "";

  const q = words[currentQuestion];
  const isEnToJp = currentQuestion % 2 === 0;

  quizScreen.dataset.isEnToJp = isEnToJp;
  quizScreen.dataset.answer = isEnToJp ? q.jp : q.en;
  quizScreen.dataset.audio = isEnToJp ? q.enAudio : q.jpAudio;

  questionCounterDiv.textContent = `Question ${currentQuestion + 1} of ${words.length}`;
  const progress = (currentQuestion + 1) / words.length;
  progressFill.style.width = (progress * 100) + "%";
  progressFill.style.backgroundColor = progress < 0.5 ? "#FFA500" : progress < 1 ? "#FFD700" : "#4CAF50";

  let options = words.map(w => isEnToJp ? w.jp : w.en);
  shuffle(options);
  options = options.slice(0,3);
  if (!options.includes(quizScreen.dataset.answer)) {
    options[Math.floor(Math.random()*3)] = quizScreen.dataset.answer;
  }

  const colors = ["#FFA500", "#FF4C4C", "#4CAF50"]; 
  options.forEach((opt, index) => {
    const btn = document.createElement("button");
    btn.textContent = opt;
    btn.className = "choice-btn";
    btn.style.backgroundColor = colors[index % colors.length];
    btn.style.color = "#fff";
    btn.style.fontSize = "18px";
    btn.style.padding = "14px";
    btn.onclick = () => checkAnswer(opt, btn);
    choicesDiv.appendChild(btn);
  });
}

function playWord() {
  const audioFile = quizScreen.dataset.audio;
  if (!audioFile) return;
  const audio = new Audio(audioFile);
  audio.play();
}

function checkAnswer(choice, btn) {
  const correct = quizScreen.dataset.answer;
  disableChoices();

  if (choice === correct) {
    feedbackDiv.classList.add("correct");
    feedbackDiv.textContent = "Correct!";
    btn.classList.add("correct");
    score += firstTry ? 2 : 1;
	const word = words[currentQuestion].en;
    progressData.seen[word] = (progressData.seen[word] || 0) + 1;  
	  
  } else {
    if (firstTry) {
  feedbackDiv.style.color = "orange";
  feedbackDiv.textContent = "Try again!";
  firstTry = false;

  const word = words[currentQuestion].en;
  progressData.wrong[word] = (progressData.wrong[word] || 0) + 1;

  enableChoices();
  return;
} else {
      feedbackDiv.style.color = "red";
      feedbackDiv.textContent = `Wrong! Correct answer: ${correct}`;
		const word = words[currentQuestion].en;
progressData.seen[word] = (progressData.seen[word] || 0) + 1;
		
    }
  }

  if (currentQuestion === words.length - 1) {
    setTimeout(endQuiz, 1000);
  } else {
    const nextBtn = document.createElement("button");
    nextBtn.textContent = "Next Question →";
    nextBtn.style.backgroundColor = "#800080"; 
    nextBtn.style.color = "#fff";
    nextBtn.style.fontSize = "16px";
    nextBtn.style.padding = "12px";
    nextBtn.style.marginTop = "10px";
    nextBtn.style.borderRadius = "8px";
    nextBtn.onclick = nextQuestion;
    choicesDiv.appendChild(nextBtn);
  }
}

function disableChoices() {
  choicesDiv.querySelectorAll(".choice-btn").forEach(btn => btn.disabled = true);
}

function enableChoices() {
  choicesDiv.querySelectorAll(".choice-btn").forEach(btn => btn.disabled = false);
}

function nextQuestion() {
  currentQuestion++;
  showQuestion();
}

function endQuiz() {
 localStorage.setItem(progressKey, JSON.stringify(progressData));
  quizScreen.classList.add("hidden");
  endScreen.classList.remove("hidden");
  const endTime = new Date();
  const totalSeconds = Math.floor((endTime - startTime)/1000);
  const minutes = Math.floor(totalSeconds / 60);
  const seconds = totalSeconds % 60;
  const dateString = endTime.toLocaleDateString() + " " + endTime.toLocaleTimeString();

  const quizTitle = document.getElementById("gameTitle").textContent;

  finalResult.innerHTML = `<strong>${quizTitle}</strong><br><br>
                           ${nickname}'s score: ${score} / ${words.length * 2}<br>
                           Time played: ${minutes} min ${seconds} sec<br>
                           Date: ${dateString}`;
}

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}
	
	const savedName = localStorage.getItem("nickname");
if (savedName) {
  document.getElementById("nickname").value = savedName;
  startQuiz();
}
</script>
</body>
</html>
